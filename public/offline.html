<!doctype html>
<html lang="id">
    <head>
        <meta charset="utf-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1" />
        <meta name="theme-color" content="#111111" />
        <meta name="color-scheme" content="light dark" />
        <title>SIMONTOK tidak tersambung</title>
        <style>
            :root {
                color-scheme: light dark;
                font-family:
                    'Instrument Sans', ui-sans-serif, system-ui, sans-serif;
                background: #fafafa;
                color: #171717;
            }

            * {
                box-sizing: border-box;
            }

            body {
                min-height: 100vh;
                min-height: 100dvh;
                margin: 0;
                display: grid;
                place-items: center;
                padding: 24px;
                background: #fafafa;
            }

            main {
                width: min(100%, 420px);
                text-align: center;
            }

            img {
                width: 80px;
                height: 80px;
                margin-bottom: 24px;
                border-radius: 12px;
            }

            h1 {
                margin: 0;
                font-size: clamp(1.35rem, 5vw, 1.6rem);
                line-height: 1.25;
            }

            p {
                margin: 12px 0 0;
                color: #525252;
                line-height: 1.6;
            }

            button {
                min-height: 44px;
                margin-top: 24px;
                border: 1px solid #171717;
                border-radius: 7px;
                padding: 10px 18px;
                background: #171717;
                color: #ffffff;
                font: inherit;
                font-weight: 600;
                cursor: pointer;
            }

            button:focus-visible {
                outline: 3px solid #2563eb;
                outline-offset: 3px;
            }

            @media (prefers-color-scheme: dark) {
                :root,
                body {
                    background: #111111;
                    color: #f5f5f5;
                }

                p {
                    color: #bdbdbd;
                }

                button {
                    border-color: #f5f5f5;
                    background: #f5f5f5;
                    color: #171717;
                }
            }
        </style>
    </head>
    <body>
        <main>
            <img src="/icons/icon-192.png" alt="" />
            <h1>SIMONTOK sedang offline</h1>
            <p>
                Data operasional memerlukan koneksi internet. Periksa jaringan,
                lalu coba muat kembali halaman ini.
            </p>
            <button type="button" onclick="location.reload()">Coba lagi</button>
        </main>
    </body>
</html>
