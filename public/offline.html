<!doctype html>
<html lang="id">
    <head>
        <meta charset="utf-8">
        <meta name="viewport" content="width=device-width, initial-scale=1">
        <meta name="theme-color" content="#111111">
        <title>SIMONTOK tidak tersambung</title>
        <style>
            :root { color-scheme: dark; font-family: Inter, ui-sans-serif, system-ui, sans-serif; background: #111; color: #f5f5f5; }
            body { min-height: 100vh; margin: 0; display: grid; place-items: center; padding: 24px; box-sizing: border-box; }
            main { width: min(100%, 420px); text-align: center; }
            img { width: 180px; max-width: 70%; height: auto; margin-bottom: 32px; }
            h1 { margin: 0; font-size: 24px; }
            p { color: #a3a3a3; line-height: 1.6; }
            button { margin-top: 12px; border: 0; border-radius: 8px; padding: 12px 18px; background: #1261c9; color: white; font-weight: 600; cursor: pointer; }
        </style>
    </head>
    <body>
        <main>
            <img src="/favicon.svg" alt="SIMONTOK">
            <h1>Koneksi sedang terputus</h1>
            <p>SIMONTOK membutuhkan koneksi internet untuk memuat data operasional. Coba lagi saat koneksi sudah tersedia.</p>
            <button type="button" onclick="location.reload()">Coba lagi</button>
        </main>
    </body>
</html>
